[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kingdom-ai-companion"
version = "0.5.0"
description = "Local P2 AI companion for Kingdom Two Crowns"
authors = [{ name = "桔梗" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.35,<1", "httpx>=0.28,<1", "pydantic>=2.10,<3",
  "vosk>=0.3.45,<0.4", "sounddevice>=0.5.2,<0.6"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[project.scripts]
kingdom-companion = "companion.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["companion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
